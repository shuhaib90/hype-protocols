# Cloudflare Tunnel Configuration Template
# Place this file at ~/.cloudflared/config.yml or in your project root
# Replace <YOUR_TUNNEL_UUID> with the UUID generated by `cloudflared tunnel create hashape-tunnel`
# Replace hashape.fun with your verified Cloudflare domain name.

tunnel: <YOUR_TUNNEL_UUID>
credentials-file: /root/.cloudflared/<YOUR_TUNNEL_UUID>.json

ingress:
  # 1. Main Mining Terminal & DApp UI
  - hostname: hashape.fun
    service: http://localhost:3000
    originRequest:
      connectTimeout: 30s
      noTLSVerify: false
      keepAliveTimeout: 90s

  # 2. Metadata & Image CDN Subdomain (Optional, for OpenSea / Marketplaces)
  - hostname: cdn.hashape.fun
    service: http://localhost:3000
    originRequest:
      connectTimeout: 15s

  # 3. Default catch-all rule (Required by cloudflared)
  - service: http_status:404
